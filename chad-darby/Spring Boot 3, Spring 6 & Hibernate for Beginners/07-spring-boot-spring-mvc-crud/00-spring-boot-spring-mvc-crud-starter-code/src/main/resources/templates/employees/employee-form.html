<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Save Employee</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>


<div class="container">

    <h3 class="my-2">Employee Directory</h3>
    <hr>

    <p class="h4 mb-4">Save Employee</p>

    <!--    When the form is loaded, it will call the getter methods to populate form fields initially-->
    <!--    i.e (employee.getFirstName()... -->

    <form action="#" th:action="@{/api/employees/save}"
          th:object="${employee}" method="POST"
    >

        <input type="text" th:field="*{firstName}" placeholder="First name"
               class="form-control mb-4 w-25"
        />

        <input type="text" th:field="*{lastName}" placeholder="Last name"
               class="form-control mb-4 w-25"
        />

        <input type="text" th:field="*{email}" placeholder="Email"
               class="form-control mb-4 w-25"
        />

        <button type="submit" class="btn btn-info col-2">Save</button>

        <!--    When the form is submitted, it will call the setter methods-->
        <!--    i.e employee.setFirstName()...-->

    </form>

    <hr>

    <a th:href="@{/api/employees/list}" >Back to Employees List</a>

</div>
</body>
</html>
